name: CI

on:
  push:
    branches: [main]
  pull_request:

# A fork's PR gets no write access; nothing here needs any.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # DEV is developed on Windows and must keep working there; Linux is the
        # cheap majority runner. Both spawn real processes in the tests.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (core, CLI, control plane, integration)
        run: npm test

      - name: Test (desktop)
        run: npm run test:desktop
